
name: Build Solal Wise Words APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o solal.zip -d .
          chmod -R u+rwX,go+rX app
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Gradle 8.9
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          sudo unzip -q gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: gradle --version

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Solal-Wise-Words-APK
          path: app/build/outputs/apk/debug/*.apk
